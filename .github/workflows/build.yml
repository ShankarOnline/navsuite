name: Build installers

# Push to main builds the installers and keeps them as workflow artifacts.
# A version tag (v0.1.0 …) also publishes a draft GitHub Release with the installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # 22.04 keeps glibc old enough for Ubuntu 22.04+, Debian 12, Raspberry Pi OS, Fedora, Mint.
          - platform: ubuntu-22.04
            args: ''
          # ARM64 Linux: Raspberry Pi 4/5 on 64-bit Raspberry Pi OS (Debian 12+) and Ubuntu on ARM.
          - platform: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      # Windows code signing. Only runs when the WINDOWS_CERTIFICATE secret is set; otherwise the
      # build stays unsigned (no failure). The cert is a base64-encoded .pfx / .p12.
      - name: Set up Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret - building Windows unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "narada-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) { $null } else { ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force }
          $cert = if ($pw) { Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw } else { Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My }
          Remove-Item $pfx -Force
          Write-Host "Imported signing cert, thumbprint $($cert.Thumbprint)"
          # Inject the thumbprint into tauri.conf so the bundler signs the app, the .exe and the .msi.
          $cfgPath = "app/tauri.conf.json"
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          if (-not $cfg.bundle.PSObject.Properties['windows']) { $cfg.bundle | Add-Member windows ([pscustomobject]@{}) }
          $cfg.bundle.windows | Add-Member certificateThumbprint $cert.Thumbprint -Force
          $cfg.bundle.windows | Add-Member digestAlgorithm "sha256" -Force
          $cfg.bundle.windows | Add-Member timestampUrl "http://timestamp.digicert.com" -Force
          ($cfg | ConvertTo-Json -Depth 30) | Set-Content $cfgPath -Encoding utf8
          Write-Host "Windows signing configured."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (repo secrets configured). Ignored on non-macOS runners.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Narada ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

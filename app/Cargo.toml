[package]
name = "narada"
version.workspace = true
edition.workspace = true
description = "Unified file and network explorer"

[lib]
name = "narada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
portable-pty = "0.9"
dirs = "6"
base64 = "0.22"
netscan = { path = "../crates/netscan" }
vfs = { path = "../crates/vfs" }
xfer = { path = "../crates/xfer" }
dropsrv = { path = "../crates/dropsrv" }
probe = { path = "../crates/probe" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
lofty = "0.25"
mime_guess = "2"
percent-encoding = "2"
futures = "0.3"
disks = { path = "../crates/disks" }

[package]
name = "probe"
version = "0.1.0"
edition = "2024"

[dependencies]
dns-lookup = "4.0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_System_IO"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

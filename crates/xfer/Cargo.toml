[package]
name = "xfer"
version = "0.1.0"
edition = "2024"

[dependencies]
vfs = { path = "../vfs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
